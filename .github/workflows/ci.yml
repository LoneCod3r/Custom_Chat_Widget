name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    name: Syntax check (JS + inline scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/check-syntax.js

  smoke-test:
    name: Browser smoke test (all 5 widget copies, Chromium)
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test/smoke.js

  build-check:
    name: Production build is reproducible from source
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - name: Fail if the build produced any diff vs committed files
        run: |
          git diff --exit-code -- dist/chat-widget.min.js chat-widget.html chat-widget.min.html || \
          (echo "::error::Generated files are out of date — run 'node build.js' and commit the result." && exit 1)

  e2e:
    name: Cross-browser E2E (Chromium, Firefox, WebKit, mobile)
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
