<!-- Custom Chat Widget (compact) — paste before </body>. Full commented source: chat-widget.html -->
<style>
#vc-bubble{position:fixed;bottom:24px;right:24px;width:62px;height:62px;border-radius:50%;background:#4f7fff;box-shadow:0 10px 28px rgba(79,127,255,0.4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2147483000;transition:transform 0.2s ease,background 0.2s ease;box-sizing:border-box;line-height:normal;margin:0;padding:0;font:inherit;-webkit-appearance:none;appearance:none}
#vc-bubble:hover{background:#7aa0ff;transform:translateY(-2px) scale(1.04)}
#vc-bubble:focus-visible,.vc-header-close:focus-visible,.vc-option-btn:focus-visible,.vc-faq-q:focus-visible,.vc-submit:focus-visible{outline:2px solid #7aa0ff;outline-offset:2px}
#vc-bubble svg{width:26px;height:26px;fill:#ffffff;pointer-events:none}
#vc-bubble .vc-close-icon{display:none}
#vc-bubble.vc-open .vc-chat-icon{display:none}
#vc-bubble.vc-open .vc-close-icon{display:block}
#vc-window{position:fixed;bottom:100px;right:24px;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 140px);background:#121a2c;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.14);display:flex;flex-direction:column;overflow:hidden;z-index:2147482999;opacity:0;transform:translateY(16px) scale(0.98);pointer-events:none;transition:opacity 0.22s ease,transform 0.22s ease;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;box-sizing:border-box}
#vc-window *,#vc-window *::before,#vc-window *::after{box-sizing:border-box}
#vc-window:focus{outline:none}
#vc-window.vc-visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.vc-header{background:linear-gradient(135deg,#060a14,#0d1526);color:#ffffff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.vc-header-info{display:flex;align-items:center;gap:10px}
.vc-header h4{font-size:0.98rem;font-weight:700;margin:0;color:#ffffff;text-transform:none}
.vc-header .vc-status{font-size:0.76rem;opacity:0.8;display:flex;align-items:center;gap:5px;color:#ffffff}
.vc-status-dot{width:7px;height:7px;border-radius:50%;background:#4f8bff;display:inline-block}
.vc-header-close{background:rgba(255,255,255,0.12);border:none;color:#ffffff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center;transition:background 0.2s ease;font-family:inherit;margin:0;padding:0;-webkit-appearance:none;appearance:none}
.vc-header-close:hover{background:rgba(255,255,255,0.25)}
.vc-body{flex:1;overflow-y:auto;padding:18px;background:#0d1220;display:flex;flex-direction:column;gap:12px}
.vc-body::-webkit-scrollbar{width:6px}
.vc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:6px}
.vc-msg{max-width:85%;background:#182238;border:1px solid rgba(255,255,255,0.08);padding:12px 14px;border-radius:10px 10px 10px 2px;font-size:0.9rem;color:#eef1f8;align-self:flex-start;box-shadow:0 2px 6px rgba(0,0,0,0.2);animation:vc-pop 0.18s ease;margin:0}
.vc-msg.vc-user{align-self:flex-end;background:#4f7fff;color:#ffffff;border-color:#4f7fff;border-radius:10px 10px 2px 10px}
@keyframes vc-pop{from{opacity:0;transform:translateY(6px)}
to{opacity:1;transform:translateY(0)}
}
.vc-options{display:flex;flex-direction:column;gap:8px;align-self:stretch;margin:0;padding:0;list-style:none}
.vc-option-btn{background:#182238;border:1.5px solid rgba(255,255,255,0.14);color:#eef1f8;padding:11px 14px;border-radius:8px;font-size:0.88rem;font-weight:600;text-align:left;cursor:pointer;transition:background 0.18s ease,color 0.18s ease,transform 0.18s ease,border-color 0.18s ease;font-family:inherit;width:100%;display:block;margin:0;-webkit-appearance:none;appearance:none}
.vc-option-btn:hover{background:#4f7fff;border-color:#4f7fff;color:#ffffff;transform:translateY(-1px)}
.vc-faq-item{background:#182238;border:1px solid rgba(255,255,255,0.08);border-radius:10px;align-self:stretch}
.vc-faq-q{position:relative;padding:11px 34px 11px 14px;font-size:0.88rem;font-weight:600;cursor:pointer;color:#eef1f8;background:transparent;border:none;text-align:left;width:100%;display:block;font-family:inherit;margin:0;-webkit-appearance:none;appearance:none}
.vc-faq-q::after{content:'+';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#4f7fff;font-weight:700;font-size:1.1rem;transition:transform 0.2s ease}
.vc-faq-item.vc-open .vc-faq-q::after{transform:translateY(-50%) rotate(45deg)}
.vc-faq-a{max-height:0;overflow:hidden;font-size:0.85rem;color:#a6b0c8;padding:0 14px;transition:max-height 0.25s ease,padding 0.25s ease;margin:0}
.vc-faq-item.vc-open .vc-faq-a{max-height:160px;padding:0 14px 12px}
.vc-form{background:#182238;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px;align-self:stretch;display:flex;flex-direction:column;gap:10px;margin:0}
.vc-form label{font-size:0.8rem;font-weight:600;color:#eef1f8}
.vc-form input,.vc-form textarea{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,0.14);border-radius:8px;font-family:inherit;font-size:0.88rem;resize:vertical;background:#0d1220;color:#eef1f8;box-sizing:border-box;line-height:normal;appearance:none;-webkit-appearance:none}
.vc-form input:focus,.vc-form textarea:focus{outline:none;border-color:#4f7fff}
.vc-form .vc-submit{margin-top:4px;background:#4f7fff;color:#ffffff;border:none;padding:12px;border-radius:8px;font-weight:700;font-size:0.9rem;cursor:pointer;transition:background 0.2s ease;font-family:inherit;width:100%;-webkit-appearance:none;appearance:none}
.vc-form .vc-submit:hover{background:#7aa0ff}
.vc-form .vc-submit:disabled{opacity:0.6;cursor:not-allowed}
.vc-form .vc-error{color:#ff8a8a;font-size:0.78rem;display:none}
.vc-thankyou{align-self:stretch;background:#182238;border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:26px 18px;text-align:center;margin:0}
.vc-thankyou .vc-check{width:48px;height:48px;border-radius:8px;background:rgba(79,127,255,0.14);color:#7aa0ff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.vc-thankyou h4{font-size:1rem;margin:0 0 6px;color:#ffffff;text-transform:none;font-weight:700}
.vc-thankyou p{font-size:0.85rem;color:#a6b0c8;margin:0}
.vc-typing{align-self:flex-start;background:#182238;border:1px solid rgba(255,255,255,0.08);padding:12px 16px;border-radius:10px 10px 10px 2px;display:flex;gap:4px;align-items:center}
.vc-typing span{width:6px;height:6px;border-radius:50%;background:#a6b0c8;opacity:0.5;animation:vc-blink 1.2s infinite ease-in-out;display:block}
.vc-typing span:nth-child(2){animation-delay:0.15s}
.vc-typing span:nth-child(3){animation-delay:0.3s}
@keyframes vc-blink{0%,80%,100%{opacity:0.3;transform:scale(0.85)}
40%{opacity:1;transform:scale(1)}
}
.vc-footer{padding:10px 16px;text-align:center;font-size:0.72rem;color:#a6b0c8;border-top:1px solid rgba(255,255,255,0.08);background:#121a2c;flex-shrink:0}
@media (max-width:480px){#vc-window{right:16px;left:16px;width:auto;bottom:92px}
#vc-bubble{right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){#vc-bubble,#vc-window,.vc-msg,.vc-option-btn,.vc-faq-q::after,.vc-faq-a,.vc-header-close,.vc-typing span,.vc-form .vc-submit{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important}
}</style>

<button id="vc-bubble" type="button" aria-label="Open chat" aria-haspopup="dialog" aria-expanded="false" aria-controls="vc-window"><svg class="vc-chat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.48 3 2 6.94 2 11.7c0 2.61 1.36 4.95 3.5 6.53V22l3.6-2.02c.93.24 1.9.37 2.9.37 5.52 0 10-3.94 10-8.65S17.52 3 12 3z"/></svg><svg class="vc-close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.71 12 12.01l-6.3-6.3-1.41 1.41 6.3 6.3-6.3 6.3 1.41 1.41 6.3-6.3 6.3 6.3 1.41-1.41-6.3-6.3 6.3-6.3z"/></svg></button><div id="vc-window" role="dialog" aria-modal="true" aria-label="Business Solutions Hub chat" tabindex="-1">  <div class="vc-header">    <div class="vc-header-info">      <div>        <h4>Business Solutions Hub</h4>        <div class="vc-status"><span class="vc-status-dot" aria-hidden="true"></span> Usually responds within minutes</div>      </div>    </div>    <button class="vc-header-close" type="button" id="vc-close" aria-label="Close chat">&#10005;</button>  </div>  <div class="vc-body" id="vc-body" role="log" aria-live="polite" aria-relevant="additions"></div>  <div class="vc-footer">Free and unlimited chat &middot; Created by Lone Coder</div></div>

<script>
(function () {
"use strict";
var REQUEST_TIMEOUT_MS = 15000;
var FORMSPREE_ACTION = "https://formspree.io/f/xeaokykk"; // ← replace with your own endpoint
var bubble = document.getElementById("vc-bubble");
var win = document.getElementById("vc-window");
var body = document.getElementById("vc-body");
var closeBtn = document.getElementById("vc-close");
var formspreeAction = FORMSPREE_ACTION;
function getFocusable(container) {
var nodes = container.querySelectorAll(
'button:not([disabled]), [href], input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'
);
return Array.prototype.filter.call(nodes, function (el) {
return el.offsetParent !== null || el === document.activeElement;
});
}
var started = false;
var activeAbortController = null;
function scrollToBottom() {
body.scrollTop = body.scrollHeight;
}
function addBotMessage(text) {
var node = document.createElement("div");
node.className = "vc-msg";
node.textContent = text;
body.appendChild(node);
scrollToBottom();
return node;
}
function addBotMessageWithDelay(text, callback) {
var typing = document.createElement("div");
typing.className = "vc-typing";
typing.setAttribute("aria-hidden", "true");
typing.innerHTML = "<span></span><span></span><span></span>";
body.appendChild(typing);
scrollToBottom();
setTimeout(function () {
typing.remove();
addBotMessage(text);
if (callback) callback();
}, 550);
}
function addUserMessage(text) {
var node = document.createElement("div");
node.className = "vc-msg vc-user";
node.textContent = text;
body.appendChild(node);
scrollToBottom();
return node;
}
function clearOptions() {
body.querySelectorAll(".vc-options, .vc-form, .vc-thankyou").forEach(function (n) {
n.remove();
});
}
function backButton(onClick) {
var wrap = document.createElement("div");
wrap.className = "vc-options";
var btn = document.createElement("button");
btn.type = "button";
btn.className = "vc-option-btn";
btn.textContent = "Back to Menu";
btn.addEventListener("click", function () {
addUserMessage("Back to Menu");
onClick();
});
wrap.appendChild(btn);
body.appendChild(wrap);
scrollToBottom();
}
function showMainMenu() {
clearOptions();
var wrap = document.createElement("div");
wrap.className = "vc-options";
var opts = [
{ label: "Explore Services and Pricing", action: showPlans },
{ label: "FAQ and Quick Questions", action: showFAQ },
{ label: "Talk to a Consultant", action: showForm }
];
opts.forEach(function (opt) {
var b = document.createElement("button");
b.type = "button";
b.className = "vc-option-btn";
b.textContent = opt.label;
b.addEventListener("click", function () {
addUserMessage(opt.label);
opt.action();
});
wrap.appendChild(b);
});
body.appendChild(wrap);
scrollToBottom();
}
function showPlans() {
clearOptions();
addBotMessageWithDelay(
"You can view our full range of growth solutions and pricing tiers right here in the pricing section on this page. Let us know if you need a custom quote.",
function () { backButton(showMainMenu); }
);
}
function showFAQ() {
clearOptions();
addBotMessageWithDelay("Here are some quick answers. Select a question to expand it.", function () {
var faqs = [
{ q: "How quickly can we get started?", a: "Most engagements kick off within one week of signing, starting with a strategy and audit phase before campaigns go live." },
{ q: "Do you require long-term contracts?", a: "No. Engagements run month to month, and you can adjust scope or cancel with 30 days notice." },
{ q: "How do you measure success?", a: "We track ROI, cost per acquisition, and pipeline growth, with transparent monthly reporting for every engagement." }
];
faqs.forEach(function (f, index) {
var item = document.createElement("div");
item.className = "vc-faq-item";
var answerId = "vc-faq-a-" + index + "-" + Date.now();
var q = document.createElement("button");
q.type = "button";
q.className = "vc-faq-q";
q.textContent = f.q;
q.setAttribute("aria-expanded", "false");
q.setAttribute("aria-controls", answerId);
var a = document.createElement("div");
a.className = "vc-faq-a";
a.id = answerId;
a.textContent = f.a;
q.addEventListener("click", function () {
var isOpen = item.classList.toggle("vc-open");
q.setAttribute("aria-expanded", isOpen ? "true" : "false");
});
item.appendChild(q);
item.appendChild(a);
body.appendChild(item);
});
backButton(showMainMenu);
});
}
function showForm() {
clearOptions();
addBotMessageWithDelay("Leave your details below and a consultant will reply by email shortly.", function () {
var form = document.createElement("form");
form.className = "vc-form";
form.setAttribute("novalidate", "novalidate");
form.innerHTML =
'<label for="vc-name">Name</label>' +
'<input type="text" id="vc-name" name="name" required placeholder="Your name" autocomplete="name">' +
'<label for="vc-email">Email</label>' +
'<input type="email" id="vc-email" name="email" required placeholder="you@example.com" autocomplete="email">' +
'<label for="vc-message">Message</label>' +
'<textarea id="vc-message" name="message" rows="3" required placeholder="How can we help?"></textarea>' +
'<div class="vc-error" id="vc-form-error" role="alert"></div>' +
'<button type="submit" class="vc-submit">Send Message</button>';
var submitting = false;
function setError(message) {
var errorBox = form.querySelector("#vc-form-error");
errorBox.textContent = message;
errorBox.style.display = "block";
}
function clearError() {
var errorBox = form.querySelector("#vc-form-error");
errorBox.textContent = "";
errorBox.style.display = "none";
}
function resetSubmitState() {
submitting = false;
var submitBtn = form.querySelector(".vc-submit");
submitBtn.disabled = false;
submitBtn.textContent = "Send Message";
}
form.addEventListener("submit", function (e) {
e.preventDefault();
if (submitting) return; // guards against double-submit (double-click, Enter + click, etc.)
var nameField = form.querySelector("#vc-name");
var emailField = form.querySelector("#vc-email");
var messageField = form.querySelector("#vc-message");
if (!form.checkValidity()) {
if (typeof form.reportValidity === "function") form.reportValidity();
setError("Please fill in all fields with a valid email address.");
return;
}
clearError();
submitting = true;
var submitBtn = form.querySelector(".vc-submit");
submitBtn.disabled = true;
submitBtn.textContent = "Sending...";
var payload = {
name: nameField.value,
email: emailField.value,
message: messageField.value
};
if (!formspreeAction || !/^https?:\/\//i.test(formspreeAction)) {
setError("This widget has no valid data-formspree endpoint configured.");
resetSubmitState();
return;
}
if (activeAbortController) activeAbortController.abort();
var controller = (typeof AbortController !== "undefined") ? new AbortController() : null;
activeAbortController = controller;
var timeoutId = setTimeout(function () {
if (controller) controller.abort();
}, REQUEST_TIMEOUT_MS);
var fetchPromise;
try {
fetchPromise = fetch(formspreeAction, {
method: "POST",
headers: { "Content-Type": "application/json", "Accept": "application/json" },
body: JSON.stringify(payload),
signal: controller ? controller.signal : undefined
});
} catch (syncErr) {
clearTimeout(timeoutId);
setError("This widget's data-formspree endpoint looks invalid.");
resetSubmitState();
return;
}
fetchPromise
.then(function (res) {
clearTimeout(timeoutId);
if (res.ok) {
showThankYou();
} else if (res.status >= 400 && res.status < 500) {
setError("Your message could not be sent (invalid request). Please check the fields and try again.");
resetSubmitState();
} else {
setError("The server could not process your message right now. Please try again shortly.");
resetSubmitState();
}
})
.catch(function (err) {
clearTimeout(timeoutId);
if (err && err.name === "AbortError") {
setError("The request timed out. Please check your connection and try again.");
} else {
setError("Something went wrong. Please try again.");
}
resetSubmitState();
});
});
body.appendChild(form);
scrollToBottom();
backButton(showMainMenu);
});
}
function showThankYou() {
clearOptions();
var box = document.createElement("div");
box.className = "vc-thankyou";
box.innerHTML =
'<div class="vc-check" aria-hidden="true">&#10003;</div>' +
'<h4>Thank You</h4>' +
'<p>A member of our team will contact you shortly via email.</p>';
body.appendChild(box);
backButton(showMainMenu);
}
function trapFocus(e) {
if (e.key !== "Tab") return;
var focusable = getFocusable(win);
if (focusable.length === 0) {
e.preventDefault();
return;
}
var first = focusable[0];
var last = focusable[focusable.length - 1];
if (e.shiftKey && document.activeElement === first) {
e.preventDefault();
last.focus();
} else if (!e.shiftKey && document.activeElement === last) {
e.preventDefault();
first.focus();
}
}
function onWindowKeydown(e) {
if (e.key === "Escape" || e.key === "Esc") {
e.stopPropagation();
closeChat();
return;
}
trapFocus(e);
}
function openChat() {
win.classList.add("vc-visible");
bubble.classList.add("vc-open");
bubble.setAttribute("aria-expanded", "true");
win.addEventListener("keydown", onWindowKeydown);
win.focus();
if (!started) {
started = true;
addBotMessageWithDelay(
"Hello. Welcome to our Business Solutions Hub. Looking to scale your business or improve your marketing? Please choose an option below:",
showMainMenu
);
}
}
function closeChat() {
win.classList.remove("vc-visible");
bubble.classList.remove("vc-open");
bubble.setAttribute("aria-expanded", "false");
win.removeEventListener("keydown", onWindowKeydown);
if (activeAbortController) {
activeAbortController.abort();
activeAbortController = null;
}
bubble.focus();
}
bubble.addEventListener("click", function () {
if (win.classList.contains("vc-visible")) {
closeChat();
} else {
openChat();
}
});
closeBtn.addEventListener("click", closeChat);
})();
</script>
